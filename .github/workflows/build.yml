name: Build Rose Companion V2.0.1

'on':
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Rose Forge 1.12.2 / Java 8
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 7.6.4
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            https://services.gradle.org/distributions/gradle-7.6.4-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-7.6.4/bin" >> "$GITHUB_PATH"

      - name: Find and extract Rose source
        id: project
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="$(find . -type f -name build.gradle \
            -not -path './.git/*' \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit || true)"

          if [[ -z "$BUILD_FILE" ]]; then
            ZIP_FILE=""
            while IFS= read -r candidate; do
              if unzip -Z1 "$candidate" 2>/dev/null \
                | grep -Eq '(^|/)build.gradle$' \
                && unzip -Z1 "$candidate" 2>/dev/null \
                | grep -Eq '(^|/)src/main/java/com/rosecompanion/RoseCompanion.java$'; then
                ZIP_FILE="$candidate"
                break
              fi
            done < <(find . -maxdepth 4 -type f -iname '*.zip' \
              -not -path './.git/*' -print | sort)

            if [[ -z "$ZIP_FILE" ]]; then
              echo '::error::No Rose source ZIP found.'
              find . -maxdepth 4 -type f -print | sort
              exit 1
            fi

            echo "Using source archive: $ZIP_FILE"
            unzip -t "$ZIP_FILE"
            mkdir -p .rose-source
            unzip -q "$ZIP_FILE" -d .rose-source

            BUILD_FILE="$(find .rose-source -type f -name build.gradle \
              -not -path '*/build/*' -print -quit || true)"
          fi

          if [[ -z "$BUILD_FILE" ]]; then
            echo '::error::Could not locate build.gradle.'
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          PROJECT_DIR="${PROJECT_DIR#./}"
          echo "Detected Rose project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Patch Forge configuration directory
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          source = Path(
              "src/main/java/com/rosecompanion/client/GuiRoseSettings.java"
          )

          if not source.is_file():
              raise SystemExit("GuiRoseSettings.java missing")

          text = source.read_text(encoding="utf-8")

          old = 'File configDirectory = new File(minecraft.mcDataDir, "config");'

          new = 'File configDirectory = net.minecraftforge.fml.common.Loader.instance().getConfigDir();'

          if old in text:
              text = text.replace(old, new)
              source.write_text(text, encoding="utf-8")
              print("Successfully patched config directory.")
          elif new in text:
              print("Config directory already patched.")
          else:
              raise SystemExit("Could not locate config directory declaration.")
          PY

      - name: Verify Rose source
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            build.gradle
            settings.gradle
            src/main/resources/mcmod.info
            src/main/resources/assets/rosecompanion/textures/entity/rose.png
            src/main/resources/assets/rosecompanion/textures/items/rose_whistle.png
            src/main/java/com/rosecompanion/RoseCompanion.java
            src/main/java/com/rosecompanion/ai/RoseConfig.java
            src/main/java/com/rosecompanion/client/GuiRoseSettings.java
            src/main/java/com/rosecompanion/client/RoseSettingsHook.java
            src/main/java/com/rosecompanion/entity/EntityRoseDog.java
            src/main/java/com/rosecompanion/item/ItemRoseWhistle.java
            src/main/java/com/rosecompanion/world/RoseHouseBuilder.java
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "::error::Missing source file: $file"
              exit 1
            }
            echo "Verified: $file"
          done

          grep -Fq '5.1.77' build.gradle
          grep -Fq '1.12.2-14.23.5.2864' build.gradle
          grep -Fq 'Loader.instance().getConfigDir()' \
            src/main/java/com/rosecompanion/client/GuiRoseSettings.java

          echo 'Rose source verification passed.'

      - name: Build Rose Companion
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle clean build \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee build.log

      - name: Verify compiled JAR
        id: jar
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          JAR_FILE="$(find build/libs -maxdepth 1 -type f \
            -name 'RoseCompanion-*.jar' \
            ! -name '*-sources.jar' -print -quit)"

          if [[ -z "$JAR_FILE" || ! -s "$JAR_FILE" ]]; then
            echo '::error::Rose JAR was not generated.'
            exit 1
          fi

          jar tf "$JAR_FILE" > jar-contents.txt

          required_entries=(
            mcmod.info
            com/rosecompanion/RoseCompanion.class
            com/rosecompanion/entity/EntityRoseDog.class
            com/rosecompanion/ai/RoseConfig.class
            com/rosecompanion/client/GuiRoseSettings.class
            com/rosecompanion/client/RoseSettingsHook.class
            assets/rosecompanion/textures/entity/rose.png
            assets/rosecompanion/textures/items/rose_whistle.png
          )

          for entry in "${required_entries[@]}"; do
            grep -Fxq "$entry" jar-contents.txt || {
              echo "::error::Missing JAR entry: $entry"
              exit 1
            }
          done

          echo "jar_file=$JAR_FILE" >> "$GITHUB_OUTPUT"
          echo 'Rose JAR verification passed.'

      - name: Upload Rose Companion V2.0.1
        uses: actions/upload-artifact@v4
        with:
          name: RoseCompanion-2.0.1-Forge-1.12.2
          path: ${{ steps.project.outputs.project_dir }}/${{ steps.jar.outputs.jar_file }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log if failed
        if: ${{ failure() && steps.project.outputs.project_dir != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Rose-Build-Error-Log
          path: ${{ steps.project.outputs.project_dir }}/build.log
          if-no-files-found: ignore
          retention-days: 7
